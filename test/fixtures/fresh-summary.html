<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신규 기사 요약 — 모의 계약 검증</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:1000px;margin:32px auto;padding:0 20px;background:#0c1221;color:#e4eaf6}h1{font-size:26px}.live{display:flex;flex-wrap:wrap;align-items:center;gap:12px}button,select{font:inherit;padding:9px 13px;background:#263957;color:inherit;border:1px solid #536786;border-radius:8px}a{color:#9bc9ff}.st,.meta{font-size:13px;color:#acbad2}.item{padding:16px 0;border-bottom:1px solid #32405a}.fresh{padding:0 18px;border:1px solid #365b78;border-radius:10px}details summary{cursor:pointer}.sum{margin:10px 0;background:#18243a;padding:16px;border-radius:8px}.fixture{padding:12px;background:#1c2940}pre{white-space:pre-wrap;font-size:12px}h2{font-size:19px}#fresh-summary-notice{flex-basis:100%}</style></head><body>
<h1>BESS 일일 브리핑</h1><p class="fixture">로컬 모의 API 전용 · 운영 요약 요청 0회 · 기준일 2026-11-25 / 기준 커밋 ad89756</p>
<div class="live"><button id="refresh-btn">🔄 새 소식 확인</button><span id="live-status" class="st">새 소식 제목과 AI 요약 상태를 확인합니다</span></div>
<p><label>검증 시나리오 <select id="scenario"><option value="done">요약 완료</option><option value="waiting_limit">한도 대기</option><option value="over_budget">오늘 전체 30건 한도</option><option value="duplicate">중복 기사</option><option value="429">요청 429</option><option value="unavailable">API 미배포 404</option><option value="unavailable_signal">summary_available=false</option><option value="legacy">후보 id 없는 구 API</option><option value="batch">신규 12건</option></select></label></p>
<details class="item" id="published"><summary>기존 정적 발행 기사 — 보존 대상</summary><p>기존 요약 본문은 새 소식 확인 후에도 그대로 유지됩니다</p></details>
<h2>국내 · 배터리·셀</h2><div id="kr" class="fresh"></div><h2>해외 · 시장·프로젝트</h2><div id="global" class="fresh"></div>
<p class="meta">30초 뒤 자동 상태 조회 · 시나리오 전환은 페이지를 다시 연 뒤 검증해 주세요</p><pre id="requests">모의 API 호출: 0회</pre>
<script>
const jobs=new Map(), log=[];
const stamp=()=>new Date().toISOString().replace(/(\.\d{3})Z$/,(_,fraction)=>fraction+'000Z');
const day=()=>new Date(Date.now()+9*3600000).toISOString().slice(0,10);
const budget=()=>({date:day(),used:document.querySelector('#scenario').value==='over_budget'?30:jobs.size,limit:30});
window.fetch=async function(url,options={}){
  if(!url.startsWith('/api/briefing/')) throw Error('모의 API 외 fetch 금지');
  log.push((options.method||'GET')+' '+url); document.querySelector('#requests').textContent='모의 API 호출: '+log.length+'회\n'+log.join('\n');
  const scenario=document.querySelector('#scenario').value;
  const reply=(body,status=200,headers={})=>new Response(JSON.stringify(body),{status,headers:{'Content-Type':'application/json',...headers}});
  if(scenario==='unavailable')return reply({},404);
  if(options.method==='POST'){
    if(scenario==='429')return reply({},429,{'Retry-After':'120'});
    const ids=JSON.parse(options.body).candidate_ids;
    ids.forEach(id=>jobs.set(id,{candidate_id:id,status:['waiting_limit','over_budget','duplicate'].includes(scenario)?scenario:'queued',attempts:0,updated_at:stamp()}));
    return reply({jobs:ids.map(candidate_id=>({candidate_id,status:jobs.get(candidate_id).status})),budget:budget()},202);
  }
  const ids=new URL(url,location.origin).searchParams.get('ids').split(',');
  const items=ids.map(id=>{
    const job=jobs.get(id); if(!job)return null;
    if(scenario==='waiting_limit')return {...job,next_retry_at:new Date(Date.now()+7200000).toISOString()};
    if(scenario==='duplicate')return {...job,duplicate_of:'/briefing/2026-11-25#kr:0:0'};
    return {...job,status:'done',attempts:1,updated_at:stamp(),summary:{title_ko:'배터리 저장장치 신규 프로젝트',background:'전력망 안정화를 위한 신규 저장장치 사업이 발표됐습니다',key:['용량과 일정은 원문에서 확인해 주세요','모의 계약 데이터입니다'],detail:'기존 정적 발행과 분리된 신규 기사 요약입니다',implication:'수주와 계통 연계 조건을 함께 살펴볼 수 있습니다',has_body:true}};
  });
  return items.some(i=>!i)?reply({},400):reply({items,budget:budget()});
};
document.querySelector('#refresh-btn').addEventListener('click',()=>{
  const scenario=document.querySelector('#scenario').value;
  for(const region of ['kr','global'])document.getElementById(region).textContent='';
  const count=scenario==='batch'?12:2;
  for(let i=0;i<count;i++){
    const card=document.createElement('div');card.className='item';
    if(scenario!=='legacy'){card.dataset.candidateId='fixture_'+scenario+'_'+i;card.dataset.summaryStatus=jobs.get(card.dataset.candidateId)?.status||'queued';card.dataset.summaryRequested=String(jobs.has(card.dataset.candidateId));}
    const a=document.createElement('a');a.href='#published';a.textContent='신규 소식 '+(i+1)+' — 에너지저장 시장 동향';card.appendChild(a);
    const meta=document.createElement('div');meta.className='meta';meta.textContent='모의 매체 · '+day();card.appendChild(meta);
    document.getElementById(i%2?'global':'kr').appendChild(card);
  }
  document.querySelector('#live-status').textContent='새 소식 '+count+'건 · 각 부문 상단';
  document.dispatchEvent(new CustomEvent('briefing:fresh-rendered',{detail:{updated:day()+' 10:00',summary_available:scenario!=='unavailable_signal'}}));
});
</script><script type="module" src="/briefing/fresh-summary.js"></script></body></html>
